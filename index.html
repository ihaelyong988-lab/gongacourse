<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 확대 차단(maximum-scale·user-scalable)을 걷어냈다 — 부모님과 함께 보는 앱에서 핀치 줌을 막으면
       작은 글씨를 읽을 방법이 사라진다(앱 내 글자 크기 설정은 만보기 탭 시트 안에 숨어 있다). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2e7d32">
  <title>꽁아코스 - 경험자와 소통하는 나들이 가이드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 상단 앱바 (검색창을 최상단 로고 옆에 배치) -->
  <header class="appbar">
    <button class="appbar-back" id="appbar-back" onclick="goBack()" aria-label="뒤로가기"><i class="fa-solid fa-chevron-left"></i></button>
    <span class="appbar-logo" id="appbar-logo" role="button" tabindex="0" onclick="goTab('home')">꽁아코스</span>
    <div class="appbar-search" id="appbar-search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="global-search" placeholder="코스 · 지역 · 맛집 검색" oninput="onGlobalSearch(this.value)">
    </div>
    <div class="appbar-profile" id="appbar-profile" style="display:none"></div>
  </header>

  <main class="app-main">

    <!-- 1. 홈 (본문은 renderHome이 채운다. 아래 안내는 스크립트가 붙기 전·실패했을 때만 보이는 폴백이다.) -->
    <section class="screen active" id="screen-home">
      <div class="screen-pad" id="home-body">
        <noscript><p class="nojs-note">이 앱은 자바스크립트로 코스를 불러옵니다. 브라우저 설정에서 자바스크립트를 켠 뒤 새로고침해 주세요.</p></noscript>
        <div class="boot-fallback" id="boot-fallback" role="status">
          <p>코스를 불러오는 중입니다. 30초 이상 멈추면 새로고침해 주세요.</p>
          <button type="button" onclick="location.reload()">새로고침</button>
        </div>
      </div>
    </section>

    <!-- 2. 코스탐색 -->
    <section class="screen" id="screen-explore">
      <div class="screen-pad" id="explore-body"></div>
    </section>

    <!-- 3. 상세 -->
    <section class="screen" id="screen-detail">
      <div class="screen-pad" id="detail-body"></div>
    </section>

    <!-- 4. 소통 -->
    <section class="screen" id="screen-community">
      <div class="screen-pad" id="community-body"></div>
    </section>

    <!-- 5. 저장 -->
    <section class="screen" id="screen-saved">
      <div class="screen-pad" id="saved-body"></div>
    </section>

    <!-- 6. 내 정보 -->
    <section class="screen" id="screen-mypage">
      <div class="screen-pad" id="mypage-body"></div>
    </section>

    <!-- 7. 모음집 (명산100·가고싶은 섬·세계 트레일·골프장·세계 탐방지) -->
    <section class="screen" id="screen-collection">
      <div class="screen-pad" id="collection-body"></div>
    </section>

    <!-- 8. 모음집 상세 (세계 트레일·골프장·세계 탐방지 개별 페이지) -->
    <section class="screen" id="screen-collitem">
      <div class="screen-pad" id="collitem-body"></div>
    </section>

    <!-- 9. 테마 허브 (홈 바로가기 6종 — 가볍게 산책·맛집·사찰·먼길·오늘 인기·새로 등록) -->
    <section class="screen" id="screen-themehub">
      <div class="screen-pad" id="themehub-body"></div>
    </section>

  </main>

  <!-- 하단 5탭 -->
  <nav class="tabbar">
    <button class="tab active" data-tab="home" onclick="goTab('home')"><i class="fa-solid fa-house"></i><span>홈</span></button>
    <button class="tab" data-tab="explore" onclick="goTab('explore')"><i class="fa-solid fa-compass"></i><span>탐색</span></button>
    <button class="tab" data-tab="community" onclick="goTab('community')"><i class="fa-solid fa-comments"></i><span>소통</span></button>
    <button class="tab" data-tab="saved" onclick="goTab('saved')"><i class="fa-solid fa-heart-pulse"></i><span>헬스</span></button>
    <button class="tab" data-tab="mypage" onclick="goTab('mypage')"><i class="fa-solid fa-shoe-prints"></i><span>만보기</span></button>
  </nav>

  <!-- 부팅 실패 폴백 — 이동 중 회선이 끊겨 app.js(약 1MB) 내려받기가 중단되거나 스크립트가 터지면
       모든 화면 본문이 빈 채로 남아 방문자는 흰 화면만 본다. 폴백 문구가 아직 살아 있을 때(=렌더 전)만
       실패 안내로 바꾼다 — 렌더 성공 뒤의 사소한 예외로 화면을 지워버리지 않기 위해서다. -->
  <script>
    function bootFail() {
      var el = document.getElementById('boot-fallback');
      if (!el) return;                      // renderHome이 이미 덮어썼다 = 부팅 성공
      el.setAttribute('role', 'alert');
      el.className = 'boot-fallback failed';
      el.innerHTML = '<p>코스를 불러오지 못했습니다. 통신 상태를 확인한 뒤 다시 시도해 주세요.</p>'
        + '<button type="button" onclick="location.reload()">다시 시도</button>';
    }
    window.addEventListener('error', bootFail);   // 구문 오류·초기화 중 예외 (리소스 오류는 캡처 단계라 안 걸린다)
  </script>
  <script src="data/waterfalls-part1.js" onerror="bootFail()"></script>
  <script src="data/waterfalls-part2.js" onerror="bootFail()"></script>
  <script src="data/waterfalls-part3.js" onerror="bootFail()"></script>
  <script src="data/waterfalls-part4.js" onerror="bootFail()"></script>
  <script src="data/waterfalls-part5.js" onerror="bootFail()"></script>
  <script src="data/waterfalls.js" onerror="bootFail()"></script>
  <script src="app.js" onerror="bootFail()"></script>
</body>
</html>
